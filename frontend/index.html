<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LibReserve - Redirecting</title>
    <script src="/js/app.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const sessionUser = localStorage.getItem("user");
            if (sessionUser) {
                const user = JSON.parse(sessionUser);
                window.location.href = getDashboardUrl(user.role);
            } else {
                window.location.href = "/login";
            }
        });
    </script>
</head>
<body style="background-color: #090a0f; color: #9ca3af; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh;">
    <div style="text-align: center;">
        <h2>Redirecting to LibReserve...</h2>
    </div>
</body>
</html>
